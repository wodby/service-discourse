version: 0.1

workflows:
  main:
    jobs:
    - build

jobs:
  build:
    steps:
    - clone
    - run: wodby ci init $WODBY_BUILD_ID
    # Installing Discourse's gems and building its assets takes longer than the
    # 10-minute default for a single step.
    - run:
        script: wodby ci build --build-arg DISCOURSE_GIT_VERSION="$(git rev-parse HEAD)"
        timeout: 30m
    - run: wodby ci push
    - run: wodby ci deploy
